# Copy .env.example to .env and fill it in before bringing this stack up.
#
# JWT_SECRET and ADMIN_PASSWORD use the ${VAR:?err} form on purpose: compose
# aborts when they are unset rather than falling back to a value published in
# this repo. A shipped default would hand every reader of the repo a valid
# signing key and a working admin login.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-pgUser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pgPassword}
      POSTGRES_DB: ${DB_NAME:-pgDb}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${DB_USER:-pgUser} -d ${DB_NAME:-pgDb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      DATABASE_URL: "postgresql://${DB_USER:-pgUser}:${DB_PASSWORD:-pgPassword}@db:5432/${DB_NAME:-pgDb}"
      PORT: "3000"
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (see .env.example)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set (see .env.example)}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres-data:
