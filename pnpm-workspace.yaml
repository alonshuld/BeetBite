packages:
  - apps/*

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/engines'
  - '@scarf/scarf'
  - bcrypt
  - cpu-features
  - prisma
  - protobufjs
  - puppeteer
  - ssh2
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
packageExtensions:
  # jest-dom's `declare module 'vitest'` matcher types resolve `vitest` from
  # jest-dom's own location. The workspace holds more than one vitest@5 copy
  # (vite-plus peers differ per app), so without this peer it can augment a
  # different copy than the frontend's `vite-plus/test`, and every jest-dom
  # matcher stops type-checking.
  '@testing-library/jest-dom':
    peerDependencies:
      vitest: '*'
    peerDependenciesMeta:
      vitest:
        optional: true
