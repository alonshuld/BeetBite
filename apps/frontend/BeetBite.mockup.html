<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BeetBite</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --beet: oklch(52% 0.22 5);
    --beet-bright: oklch(62% 0.20 5);
    --beet-dim: oklch(40% 0.18 5);
    --beet-glow: oklch(52% 0.22 5 / 0.18);
    --rose: oklch(70% 0.16 350);
    --bg: oklch(10% 0.015 350);
    --surface: oklch(14% 0.018 350);
    --surface2: oklch(17% 0.018 350);
    --surface3: oklch(21% 0.018 350);
    --border: oklch(28% 0.02 350 / 0.6);
    --text: oklch(92% 0.008 350);
    --text-muted: oklch(58% 0.012 350);
    --text-dim: oklch(40% 0.01 350);
    --success: oklch(68% 0.18 145);
    --warning: oklch(75% 0.18 75);
    --danger: oklch(58% 0.22 25);
    --sidebar-w: 240px;
    --radius: 10px;
    --radius-sm: 6px;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; line-height: 1.5; }
  body { overflow: hidden; }
  #root { height: 100%; }

  /* Grain overlay */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 9999; opacity: 0.6;
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--beet-dim); }

  input, select, textarea {
    font-family: 'DM Sans', sans-serif;
    background: var(--surface3);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--beet); box-shadow: 0 0 0 3px var(--beet-glow); }
  select option { background: var(--surface); }
  label { display: block; font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 5px; letter-spacing: 0.04em; text-transform: uppercase; }
  button { font-family: 'DM Sans', sans-serif; cursor: pointer; border: none; outline: none; }

  .btn-primary {
    background: var(--beet);
    color: #fff;
    padding: 9px 18px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    transition: background 0.2s, transform 0.1s;
  }
  .btn-primary:hover { background: var(--beet-bright); }
  .btn-primary:active { transform: scale(0.98); }

  .btn-ghost {
    background: transparent;
    color: var(--text-muted);
    padding: 9px 18px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 500;
    border: 1px solid var(--border);
    transition: all 0.2s;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--beet-dim); background: var(--surface2); }

  .btn-danger {
    background: transparent;
    color: var(--danger);
    padding: 7px 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 500;
    border: 1px solid var(--danger);
    transition: all 0.2s;
  }
  .btn-danger:hover { background: oklch(58% 0.22 25 / 0.12); }

  .btn-icon {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 32px; height: 32px;
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    transition: all 0.2s;
  }
  .btn-icon:hover { color: var(--text); border-color: var(--beet-dim); background: var(--surface2); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
  }
  .card-sm {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
  }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); padding: 10px 14px; border-bottom: 1px solid var(--border); }
  td { padding: 13px 14px; border-bottom: 1px solid oklch(28% 0.02 350 / 0.25); font-size: 14px; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tbody tr { transition: background 0.15s; }
  tbody tr:hover { background: var(--surface2); }

  .badge {
    display: inline-flex; align-items: center;
    padding: 3px 9px; border-radius: 100px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.03em;
  }
  .badge-green { background: oklch(68% 0.18 145 / 0.15); color: var(--success); }
  .badge-red { background: oklch(58% 0.22 25 / 0.15); color: var(--danger); }
  .badge-yellow { background: oklch(75% 0.18 75 / 0.15); color: var(--warning); }
  .badge-beet { background: var(--beet-glow); color: var(--beet-bright); }
  .badge-muted { background: oklch(28% 0.02 350 / 0.4); color: var(--text-muted); }

  .form-group { margin-bottom: 16px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: oklch(5% 0.01 350 / 0.75);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 24px;
    animation: fadeIn 0.15s ease;
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    width: 100%; max-width: 520px;
    max-height: 90vh; overflow-y: auto;
    animation: slideUp 0.2s ease;
  }
  .modal-lg { max-width: 720px; }
  .modal-title { font-family: 'DM Serif Display', serif; font-size: 22px; margin-bottom: 20px; color: var(--text); }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes slideIn { from { transform: translateX(-8px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  .page { animation: slideIn 0.2s ease; }

  /* Month picker */
  .month-picker {
    display: flex; align-items: center; gap: 10px;
  }
  .month-picker button {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 30px; height: 30px;
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; transition: all 0.2s;
  }
  .month-picker button:hover { color: var(--text); border-color: var(--beet-dim); }
  .month-picker .month-label {
    font-weight: 600; font-size: 15px; min-width: 120px; text-align: center;
  }

  /* Toggle */
  .toggle {
    position: relative; display: inline-block;
    width: 38px; height: 22px;
  }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute; inset: 0;
    background: var(--surface3); border: 1px solid var(--border);
    border-radius: 11px; cursor: pointer; transition: all 0.25s;
  }
  .toggle-slider::before {
    content: ''; position: absolute;
    width: 14px; height: 14px;
    left: 3px; top: 3px;
    background: var(--text-muted);
    border-radius: 50%; transition: all 0.25s;
  }
  .toggle input:checked + .toggle-slider { background: var(--beet); border-color: var(--beet); }
  .toggle input:checked + .toggle-slider::before { transform: translateX(16px); background: #fff; }

  .divider { height: 1px; background: var(--border); margin: 16px 0; }

  .empty-state {
    text-align: center; padding: 60px 24px;
    color: var(--text-muted);
  }
  .empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }
  .empty-state p { font-size: 15px; margin-bottom: 6px; color: var(--text-dim); }

  .page-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 28px;
  }
  .page-title {
    font-family: 'DM Serif Display', serif;
    font-size: 26px; font-weight: 400;
  }
  .page-subtitle { color: var(--text-muted); font-size: 13px; margin-top: 2px; }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
  }
  .stat-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin-bottom: 8px; }
  .stat-value { font-size: 26px; font-weight: 700; line-height: 1; }
  .stat-sub { font-size: 12px; color: var(--text-muted); margin-top: 5px; }

  .tooltip-wrap { position: relative; display: inline-block; }
  .tooltip {
    position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%);
    background: var(--surface3); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 10px 14px;
    white-space: nowrap; z-index: 100;
    box-shadow: 0 8px 24px oklch(5% 0.01 350 / 0.5);
    font-size: 13px; min-width: 180px;
    animation: fadeIn 0.15s ease;
  }

  .link-btn {
    background: none; border: none;
    color: var(--beet-bright); font-size: 14px;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
    text-decoration: underline; text-decoration-color: transparent;
    transition: text-decoration-color 0.2s;
    padding: 0;
  }
  .link-btn:hover { text-decoration-color: var(--beet-bright); }

  .timeline-wrap {
    position: relative; padding-left: 20px;
  }
  .timeline-wrap::before {
    content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px;
    width: 2px; background: var(--border); border-radius: 1px;
  }
  .timeline-item {
    position: relative; margin-bottom: 20px;
  }
  .timeline-dot {
    position: absolute; left: -17px; top: 5px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--beet); border: 2px solid var(--bg);
  }
  .timeline-dot.active {
    background: var(--success);
    box-shadow: 0 0 0 3px oklch(68% 0.18 145 / 0.2);
  }

  .search-input {
    position: relative; display: flex; align-items: center;
  }
  .search-input input { padding-left: 34px; }
  .search-input .search-icon {
    position: absolute; left: 10px; color: var(--text-dim); font-size: 15px; pointer-events: none;
  }

  /* ── RTL SUPPORT ─────────────────────────────────────────────────────────── */
  [dir="rtl"] { font-family: 'DM Sans', 'Arial Hebrew', sans-serif; }
  [dir="rtl"] .page-header { flex-direction: row-reverse; }
  [dir="rtl"] .top-header-inner { flex-direction: row-reverse; }
  [dir="rtl"] .month-picker { flex-direction: row-reverse; }
  [dir="rtl"] .sidebar-drawer { left: auto; right: 0; transform: translateX(100%); }
  [dir="rtl"] .sidebar-drawer.open { transform: translateX(0); }
  [dir="rtl"] .modal-footer { flex-direction: row-reverse; }
  [dir="rtl"] th, [dir="rtl"] td { text-align: right; }
  [dir="rtl"] .search-input .search-icon { left: auto; right: 10px; }
  [dir="rtl"] .search-input input { padding-left: 12px; padding-right: 34px; }
  [dir="rtl"] .timeline-wrap { padding-left: 0; padding-right: 20px; }
  [dir="rtl"] .timeline-wrap::before { left: auto; right: 6px; }
  [dir="rtl"] .timeline-dot { left: auto; right: -17px; }

  .lang-toggle {
    display: flex; align-items: center; gap: 0;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden; flex-shrink: 0;
  }
  .lang-toggle button {
    padding: 5px 10px;
    font-size: 12px; font-weight: 600;
    color: var(--text-dim);
    background: transparent;
    border: none; cursor: pointer;
    transition: all 0.15s;
    line-height: 1;
  }
  .lang-toggle button.active {
    background: var(--beet);
    color: #fff;
  }
  .lang-toggle button:not(.active):hover { color: var(--text); background: var(--surface3); }

  /* ── MOBILE RESPONSIVE ──────────────────────────────────────────────────── */
  .mob-menu-btn {
    display: none;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 34px; height: 34px;
    border-radius: var(--radius-sm);
    align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
    cursor: pointer;
  }

  .sidebar-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: oklch(5% 0.01 350 / 0.6);
    z-index: 200;
  }

  @media (min-width: 769px) {
    /* Desktop: sidebar is in normal flow, no drawer behaviour */
    .sidebar-drawer {
      position: relative !important;
      transform: none !important;
      box-shadow: none !important;
      transition: none !important;
    }
    .sidebar-spacer { display: none !important; }
    .mob-menu-btn { display: none !important; }
  }

  @media (max-width: 768px) {
    :root { --sidebar-w: 260px; }

    .mob-menu-btn { display: flex; }

    /* Hide the desktop sidebar spacer — sidebar is fixed on mobile */
    .sidebar-spacer { display: none !important; }

    /* Sidebar becomes a fixed drawer */
    .sidebar-drawer {
      position: fixed !important;
      top: 0; left: 0; bottom: 0;
      z-index: 300;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      box-shadow: 4px 0 32px oklch(5% 0.01 350 / 0.6);
    }
    .sidebar-drawer.open {
      transform: translateX(0);
    }
    .sidebar-backdrop.open { display: block; }

    /* Top header: tighter */
    .top-header-inner {
      padding: 0 16px !important;
    }
    .top-header-title { display: none; }

    /* Main content: smaller padding */
    .main-content {
      padding: 20px 16px !important;
    }

    /* Page header: stack on mobile */
    .page-header {
      flex-direction: column;
      align-items: flex-start !important;
      gap: 12px;
    }

    /* Project report cards: stack */
    .report-card-row {
      flex-direction: column !important;
      align-items: flex-start !important;
      gap: 12px !important;
    }
    .report-card-stats {
      width: 100%;
      flex-wrap: wrap;
      gap: 16px !important;
    }

    /* Two-col grids → single col */
    .two-col-grid {
      grid-template-columns: 1fr !important;
    }

    /* Stat cards: 1 col on very small, 2 col on medium mobile */
    .stat-grid {
      grid-template-columns: 1fr 1fr !important;
    }

    /* Form rows: single col on mobile */
    .form-row {
      grid-template-columns: 1fr !important;
    }

    /* Tables: make scrollable */
    .table-scroll-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Month picker label: shorter */
    .month-picker .month-label {
      min-width: 90px !important;
      font-size: 13px !important;
    }

    /* Modal: full-width on small screens */
    .modal {
      padding: 20px 16px !important;
      max-width: 100% !important;
      margin: 0 !important;
      border-radius: var(--radius) var(--radius) 0 0 !important;
    }
    .modal-backdrop {
      align-items: flex-end !important;
      padding: 0 !important;
    }

    /* Search input: full width */
    .search-input { width: 100% !important; }

    /* CrudScreen header: stack */
    .crud-header {
      flex-direction: column !important;
      align-items: flex-start !important;
      gap: 12px;
    }
    .crud-header-actions {
      width: 100%;
      display: flex; gap: 8px;
    }
    .crud-header-actions .search-input { flex: 1; }

    /* Project detail stat strip: 1 col */
    .stat-grid-3 {
      grid-template-columns: 1fr !important;
    }

    /* Subcontractor detail panel: full width below */
    .sub-detail-grid {
      grid-template-columns: 1fr !important;
    }

    /* Corp payment tooltip: position adjustment */
    .tooltip {
      right: 0 !important; left: auto !important;
      transform: none !important;
    }
  }

  @media (max-width: 480px) {
    .stat-grid { grid-template-columns: 1fr !important; }
    .report-card-stats { gap: 10px !important; }
  }
</style>
</head>

<div id="root"></div>

// ─── HELPERS ───────────────────────────────────────────────────────────────

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function fmtMonth(ym) {
  if (!ym) return '';
  const [y, m] = ym.split('-');
  return `${MONTHS[parseInt(m)-1]} ${y}`;
}

function fmtMoney(n) {
  return '₪' + Number(n).toLocaleString('he-IL', {minimumFractionDigits: 0, maximumFractionDigits: 0});
}

function prevMonth(ym) {
  const [y, m] = ym.split('-').map(Number);
  if (m === 1) return `${y-1}-12`;
  return `${y}-${String(m-1).padStart(2,'0')}`;
}
function nextMonth(ym) {
  const [y, m] = ym.split('-').map(Number);
  if (m === 12) return `${y+1}-01`;
  return `${y}-${String(m+1).padStart(2,'0')}`;
}

function monthInRange(month, from, to) {
  return month >= from && (to === null || month <= to);
}

function getReport(data, projectId, month) {
  return data.projectReports.find(r => r.projectId === projectId && r.month === month);
}

function getReportCorpPayments(data, reportId) {
  return data.corporationPayments.filter(cp => cp.reportId === reportId);
}

function calcReport(report, data) {
  if (!report) return null;
  const profit = report.income * (report.profitMargin / 100);
  const corpPayments = getReportCorpPayments(data, report.id);
  const corpTotal = corpPayments.reduce((s, p) => s + p.amount, 0);
  const subcontractorPayment = report.income - profit - corpTotal;
  return { ...report, profit, corpTotal, subcontractorPayment, corpPayments };
}

// Build subcontractor timeline from project reports
function getSubcontractorTimeline(data, projectId) {
  const reports = data.projectReports
    .filter(r => r.projectId === projectId && r.subcontractorId)
    .sort((a, b) => a.month.localeCompare(b.month));
  // Collapse consecutive months with same subcontractor into ranges
  const ranges = [];
  for (const r of reports) {
    const last = ranges[ranges.length - 1];
    if (last && last.subcontractorId === r.subcontractorId) {
      last.to = r.month;
    } else {
      ranges.push({ subcontractorId: r.subcontractorId, from: r.month, to: r.month });
    }
  }
  return ranges;
}

function getActiveSubcontractorFromReport(data, projectId, month) {
  const report = getReport(data, projectId, month);
  if (!report || !report.subcontractorId) return null;
  return data.subcontractors.find(s => s.id === report.subcontractorId);
}

// For subcontractor monthly screen: derive amountOwed from project reports
function getSubcontractorMonthSummary(data, subcontractorId, month) {
  const reports = data.projectReports.filter(r => r.subcontractorId === subcontractorId && r.month === month);
  const projectItems = reports.map(r => {
    const calc = calcReport(r, data);
    const project = data.projects.find(p => p.id === r.projectId);
    return { project, calc };
  }).filter(x => x.project && x.calc);
  const amountOwed = projectItems.reduce((s, x) => s + x.calc.subcontractorPayment, 0);
  const payments = data.subcontractorPayments.filter(p => p.subcontractorId === subcontractorId && p.serviceMonth === month);
  const amountPaid = payments.filter(p => p.paymentDate).reduce((s, p) => s + p.amount, 0);
  return { projectItems, amountOwed, amountPaid, payments };
}

function MonthPicker({ value, onChange }) {

      <button onClick={() => onChange(prevMonth(value))}>‹</button>

  );
}

function Modal({ title, onClose, children, large }) {
  useEffect(() => {
    const h = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [onClose]);
  return (
    <div className="modal-backdrop" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className={`modal${large?' modal-lg':''}`}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
          <h2 className="modal-title" style={{margin:0}}>{title}</h2>
          <button className="btn-icon" onClick={onClose}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function ConfirmModal({ message, onConfirm, onCancel }) {
  const { t } = useContext(LangContext);
  return (
    <Modal title={t.confirm} onClose={onCancel}>
      <p style={{color:'var(--text-muted)',marginBottom:8}}>{message}</p>

  );
}

function ProjectReportModal({ data, setData, projectId, defaultMonth, existing, onClose }) {
  const { t } = useContext(LangContext);
  const [selProjectId, setSelProjectId] = useState(projectId ?? '');
  const [month, setMonth] = useState(existing?.month ?? defaultMonth ?? '2026-01');
  const [income, setIncome] = useState(existing?.income ?? '');
  const [incomeDate, setIncomeDate] = useState(existing?.incomeDate ?? '');
  const [profitMargin, setProfitMargin] = useState(existing?.profitMargin ?? '');
  const [subcontractorId, setSubcontractorId] = useState(existing?.subcontractorId ?? '');
  const [corpPayments, setCorpPayments] = useState(() => {
    if (existing) {
      return data.corporationPayments.filter(cp => cp.reportId === existing.id).map(cp => ({...cp}));
    }
    return [];
  });

  const profit = Number(income) * (Number(profitMargin) / 100);
  const corpTotal = corpPayments.reduce((s, p) => s + Number(p.amount || 0), 0);
  const subPmt = Number(income) - profit - corpTotal;

  function addCorpPayment() { setCorpPayments([...corpPayments, { corpId: '', amount: '', date: '' }]); }
  function removeCorpPayment(i) { setCorpPayments(corpPayments.filter((_, idx) => idx !== i)); }
  function updateCorpPayment(i, field, val) {
    setCorpPayments(corpPayments.map((p, idx) => idx === i ? { ...p, [field]: val } : p));
  }

  function handleSave() {
    const pid = Number(selProjectId);
    if (!pid || !month || !income) return;
    setData(d => {
      let reports = [...d.projectReports];
      let corpPmts = [...d.corporationPayments];
      let reportId;

      if (existing) {
        reportId = existing.id;
        reports = reports.map(r => r.id === existing.id ? {
          ...r, projectId: pid, month, income: Number(income),
          incomeDate: incomeDate || null,
          profitMargin: Number(profitMargin),
          subcontractorId: Number(subcontractorId) || null,
        } : r);
        // remove old corp payments for this report
        corpPmts = corpPmts.filter(cp => cp.reportId !== existing.id);
      } else {
        reportId = Math.max(0, ...reports.map(r => r.id)) + 1;
        reports.push({
          id: reportId, projectId: pid, month,
          income: Number(income),
          incomeDate: incomeDate || null,
          profitMargin: Number(profitMargin),
          subcontractorId: Number(subcontractorId) || null,
        });
      }
      // add new corp payments
      const maxCpId = Math.max(0, ...corpPmts.map(cp => cp.id));
      corpPayments.filter(cp => cp.corpId && cp.amount).forEach((cp, i) => {
        corpPmts.push({
          id: maxCpId + i + 1,
          reportId,
          corpId: Number(cp.corpId),
          amount: Number(cp.amount),
          date: cp.date || null,
        });
      });
      return { ...d, projectReports: reports, corporationPayments: corpPmts };
    });
    onClose();
  }

  return (
    <Modal title={existing ? t.editProjectReport : t.addProjectReport2} onClose={onClose} large>
      <div className="form-row">
        {!projectId && (
          <div className="form-group">
            <label>{t.projects}</label>
            <select value={selProjectId} onChange={e => setSelProjectId(e.target.value)}>
              <option value="">{t.selectClient}</option>
              {data.projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
          </div>
        )}
        <div className="form-group">
          <label>{t.reportMonth}</label>
          <input type="month" value={month} onChange={e => setMonth(e.target.value)} />
        </div>
      </div>
      <div className="form-row">
        <div className="form-group">
          <label>{t.incomeLabel}</label>
          <input type="number" placeholder="0" value={income} onChange={e => setIncome(e.target.value)} />
        </div>
        <div className="form-group">
          <label>{t.incomeDateOptional}</label>
          <input type="date" value={incomeDate} onChange={e => setIncomeDate(e.target.value)} />
        </div>
      </div>
      <div className="form-row">
        <div className="form-group">
          <label>{t.profitMargin}</label>
          <input type="number" placeholder="0" step="0.1" value={profitMargin} onChange={e => setProfitMargin(e.target.value)} />
        </div>
        <div className="form-group">
          <label>{t.subcontractorLabel}</label>
          <select value={subcontractorId} onChange={e => setSubcontractorId(e.target.value)}>
            <option value="">{t.selectSubcontractor}</option>
            {data.subcontractors.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
        </div>
      </div>
      <div style={{marginBottom:12}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
          <label style={{margin:0}}>{t.corporationPaymentsLabel}</label>
          <button className="btn-ghost" style={{padding:'5px 10px',fontSize:12}} onClick={addCorpPayment}>{t.addCorp}</button>
        </div>
        {corpPayments.map((cp, i) => (
          <div key={i} style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr auto',gap:10,marginBottom:8}}>
            <select value={cp.corpId} onChange={e => updateCorpPayment(i,'corpId',e.target.value)}>
              <option value="">{t.corporationLabel}</option>
              {data.corporations.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
            <input type="number" placeholder="0" value={cp.amount||''} onChange={e => updateCorpPayment(i,'amount',e.target.value)} />
            <input type="date" value={cp.date||''} onChange={e => updateCorpPayment(i,'date',e.target.value)} />
            <button className="btn-icon" onClick={() => removeCorpPayment(i)}>✕</button>
          </div>
        ))}
      </div>
      {income && profitMargin && (
        <div className="card-sm" style={{marginBottom:16,background:'oklch(68% 0.18 145 / 0.06)',borderColor:'oklch(68% 0.18 145 / 0.2)'}}>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:6}}>
            <span style={{color:'var(--text-muted)'}}>{t.profitPreview(profitMargin)}</span>
            <span style={{fontWeight:600,color:'var(--success)'}}>{fmtMoney(profit)}</span>
          </div>
          <div style={{display:'flex',justifyContent:'space-between',fontSize:13}}>
            <span style={{color:'var(--text-muted)'}}>{t.subPaymentPreview}</span>
            <span style={{fontWeight:700,color:'var(--success)'}}>{fmtMoney(Math.max(0, subPmt))}</span>
          </div>
        </div>
      )}
      <div className="modal-footer">
        <button className="btn-ghost" onClick={onClose}>{t.cancel}</button>
        <button className="btn-primary" onClick={handleSave}>{t.saveReport}</button>
      </div>
    </Modal>
  );
}

function MonthlyCorporationsScreen({ data, month }) {
  const { t } = useContext(LangContext);
  const [hoveredCorpId, setHoveredCorpId] = useState(null);

  const corpTotals = data.corporations.map(corp => {
    const payments = data.corporationPayments.filter(cp => {
      const report = data.projectReports.find(r => r.id === cp.reportId);
      return report && report.month === month && cp.corpId === corp.id;
    }).map(cp => {
      const report = data.projectReports.find(r => r.id === cp.reportId);
      const project = data.projects.find(p => p.id === report?.projectId);
      return { cp, project, report };
    });
    const total = payments.reduce((s, p) => s + p.cp.amount, 0);
    return { corp, payments, total };
  }).filter(c => c.total > 0);

  const grandTotal = corpTotals.reduce((s, c) => s + c.total, 0);

  return (
    <div className="page">
      <div className="page-header">
        <div>
          <h1 className="page-title">{t.corporationPayments}</h1>

        <div className="empty-state"><div className="empty-icon">🏗️</div><p>{t.noCorp(fmtMonth(month))}</p></div>

        <div className="card" style={{padding:0,overflow:'hidden'}}>
          <div className="table-scroll-wrap">
          <table>
            <thead>
              <tr>
                <th>{t.corporations}</th>
                <th style={{textAlign:'right'}}>{t.projects_col}</th>
                <th style={{textAlign:'right'}}>{t.paid}</th>
              </tr>
            </thead>
            <tbody>
              {corpTotals.map(({corp, payments, total}) => (
                <tr key={corp.id}>
                  <td style={{fontWeight:500}}>{corp.name}</td>
                  <td style={{textAlign:'right',color:'var(--text-muted)'}}>{payments.length}</td>
                  <td style={{textAlign:'right'}}>
                    <div className="tooltip-wrap"
                      onMouseEnter={() => setHoveredCorpId(corp.id)}

                      <span style={{fontWeight:700,fontSize:17,color:'var(--warning)',cursor:'default',borderBottom:'1px dashed oklch(75% 0.18 75 / 0.6)'}}>
                        {fmtMoney(total)}
                      </span>
                      {hoveredCorpId === corp.id && payments.length > 0 && (
                        <div className="tooltip" style={{right:0,left:'auto',transform:'none',minWidth:240}}>
                          <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.06em',color:'var(--text-dim)',marginBottom:8}}>{t.breakdown}</div>
                          {payments.map((p, i) => (
                            <div key={i} style={{display:'flex',justifyContent:'space-between',gap:16,marginBottom:5,fontSize:13}}>

                              <span style={{fontWeight:600,color:'var(--text)'}}>{fmtMoney(p.cp.amount)}</span>

function MonthlySubcontractorsScreen({ data, setData, month }) {
  const { t } = useContext(LangContext);
  const [selected, setSelected] = useState(null);
  const [addPaymentModal, setAddPaymentModal] = useState(null);

  const subSummaries = data.subcontractors.map(sub => {
    const summary = getSubcontractorMonthSummary(data, sub.id, month);
    return { sub, ...summary };
  }).filter(s => s.projectItems.length > 0);

  function togglePayment(paymentId) {
    setData(d => ({
      ...d,
      subcontractorPayments: d.subcontractorPayments.map(p =>
        p.id === paymentId
          ? { ...p, paymentDate: p.paymentDate ? null : new Date().toISOString().slice(0,10) }
          : p
      )
    }));
  }

  function addInstalment(subId, amount) {
    setData(d => {
      const maxId = Math.max(0, ...d.subcontractorPayments.map(p => p.id));
      return {
        ...d,
        subcontractorPayments: [...d.subcontractorPayments, {
          id: maxId + 1, subcontractorId: subId,
          serviceMonth: month, amount: Number(amount), paymentDate: null,
        }]
      };
    });
    setAddPaymentModal(null);
  }

  const selSummary = selected ? subSummaries.find(s => s.sub.id === selected) : null;

  return (
    <div className="page">
      <div className="page-header">
        <div>
          <h1 className="page-title">{t.subcontractors}</h1>
          <p className="page-subtitle">{t.paymentTracking}</p>
        </div>
      </div>
      <div className="sub-detail-grid" style={{display:'grid',gridTemplateColumns: selSummary ? '1fr 1.3fr' : '1fr', gap:20}}>
        <div>
          {subSummaries.length === 0 ? (
            <div className="empty-state"><div className="empty-icon">👷</div><p>{t.noSubActivity(fmtMonth(month))}</p></div>
          ) : (
            <div style={{display:'grid',gap:12}}>
              {subSummaries.map(({sub, amountOwed, amountPaid, projectItems}) => {
                const fullyPaid = amountPaid >= amountOwed && amountOwed > 0;
                const partial = amountPaid > 0 && !fullyPaid;
                const isSelected = selected === sub.id;
                return (
                  <div key={sub.id} className="card" style={{cursor:'pointer',borderColor:isSelected?'var(--beet-dim)':'var(--border)',background:isSelected?'var(--beet-glow)':'var(--surface)',transition:'all 0.15s'}}
                    onClick={() => setSelected(isSelected ? null : sub.id)}
                  >
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                      <div>
                        <div style={{fontWeight:600,fontSize:15}}>{sub.name}</div>
                        <div style={{color:'var(--text-muted)',fontSize:12,marginTop:2}}>{projectItems.length} {t.projects_col.toLowerCase()}</div>
                      </div>
                      <div style={{display:'flex',alignItems:'center',gap:16}}>
                        <div style={{textAlign:'right'}}>
                          <div style={{fontSize:11,color:'var(--text-dim)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.04em'}}>{t.owed}</div>
                          <div style={{fontWeight:700,fontSize:18,color:'var(--success)'}}>{fmtMoney(amountOwed)}</div>
                        </div>
                        {amountPaid > 0 && (
                          <div style={{textAlign:'right'}}>
                            <div style={{fontSize:11,color:'var(--text-dim)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.04em'}}>{t.paid}</div>
                            <div style={{fontWeight:600,fontSize:15,color: fullyPaid ? 'var(--success)' : 'var(--warning)'}}>{fmtMoney(amountPaid)}</div>
                          </div>
                        )}
                        <span className={`badge ${fullyPaid ? 'badge-green' : partial ? 'badge-yellow' : 'badge-red'}`}>
                          {fullyPaid ? t.paid : partial ? t.partial : t.unpaid}
                        </span>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>

        {selSummary && (
          <div style={{animation:'slideIn 0.2s ease'}}>
            <div className="card" style={{marginBottom:14}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
                <h3 style={{fontFamily:'DM Serif Display,serif',fontSize:18,fontWeight:400}}>{selSummary.sub.name}</h3>
                <button className="btn-icon" onClick={() => setSelected(null)}>✕</button>
              </div>
              <div style={{marginBottom:16}}>
                <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.06em',color:'var(--text-dim)',marginBottom:10}}>{t.projectsBreakdown}</div>
                <table>
                  <thead><tr><th>{t.projects}</th><th style={{textAlign:'right'}}>{t.amount}</th></tr></thead>
                  <tbody>
                    {selSummary.projectItems.map(({project:p, calc}) => (
                      <tr key={p.id}>
                        <td style={{fontSize:13}}>{p.name}</td>
                        <td style={{textAlign:'right',fontWeight:600,color:'var(--success)',fontSize:13}}>{fmtMoney(calc.subcontractorPayment)}</td>
                      </tr>
                    ))}
                  </tbody>
                  <tfoot>
                    <tr>
                      <td style={{fontWeight:700,paddingTop:12}}>{t.totalOwed}</td>
                      <td style={{textAlign:'right',fontWeight:800,fontSize:17,color:'var(--success)',paddingTop:12}}>{fmtMoney(selSummary.amountOwed)}</td>
                    </tr>
                  </tfoot>
                </table>
              </div>
            </div>
            <div className="card">
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
                <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.06em',color:'var(--text-dim)'}}>{t.paymentInstalments}</div>
                <button className="btn-ghost" style={{padding:'5px 10px',fontSize:12}} onClick={() => setAddPaymentModal(selSummary.sub.id)}>+ {t.add}</button>
              </div>
              {selSummary.payments.length === 0 ? (
                <div style={{color:'var(--text-dim)',fontSize:13,textAlign:'center',padding:'12px 0'}}>{t.noInstalments}</div>
              ) : (
                selSummary.payments.map(p => (
                  <div key={p.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 14px',borderRadius:'var(--radius-sm)',background:'var(--surface2)',marginBottom:8}}>
                    <div>
                      <div style={{fontWeight:600,fontSize:14}}>{fmtMoney(p.amount)}</div>
                      {p.paymentDate && <div style={{fontSize:11,color:'var(--text-dim)',marginTop:2}}>{t.paidOn(p.paymentDate)}</div>}
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:10}}>
                      <span className={`badge ${p.paymentDate ? 'badge-green' : 'badge-red'}`}>{p.paymentDate ? t.paid : t.unpaid}</span>
                      <label className="toggle" onClick={e => e.stopPropagation()}>
                        <input type="checkbox" checked={!!p.paymentDate} onChange={() => togglePayment(p.id)} />
                        <span className="toggle-slider"></span>
                      </label>
                    </div>
                  </div>
                ))
              )}
              <div style={{marginTop:12,paddingTop:12,borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',fontSize:13}}>
                <span style={{color:'var(--text-muted)'}}>{t.totalPaidOf(fmtMoney(selSummary.amountPaid), fmtMoney(selSummary.amountOwed))}</span>
              </div>
            </div>
          </div>
        )}
      </div>

      {addPaymentModal && (
        <AddInstalmentModal
          subId={addPaymentModal}
          onSave={(amount) => addInstalment(addPaymentModal, amount)}
          onClose={() => setAddPaymentModal(null)}
        />
      )}
    </div>
  );
}

              <tr>
                {columns.map(c=><th key={c.key}>{c.label}</th>)}
                <th style={{textAlign:'right'}}>{t.actions}</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(item=>(
                <tr key={item.id}>
                  {columns.map(c=>(
                    <td key={c.key} style={c.muted?{color:'var(--text-muted)',fontSize:13}:{}}>{c.render ? c.render(item) : item[c.key]}</td>
                  ))}
                  <td style={{textAlign:'right'}}>
                    <div style={{display:'flex',gap:6,justifyContent:'flex-end'}}>

                      <button className="btn-icon" title={t.delete} style={{color:'var(--danger)',borderColor:'var(--danger)'}} onClick={()=>onDelete(item)}>⌫</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          </div>
        )}
      </div>
    </div>
  );
}

  const { t } = useContext(LangContext);
  const [modal, setModal] = useState(null);
  const [confirm, setConfirm] = useState(null);
  function save(f) {
    setData(d => {
      if (f.id) return { ...d, clients: d.clients.map(c => c.id === f.id ? f : c) };

      return { ...d, projects: [...d.projects, {...f, id}] };
    });
    setModal(null);
  }
  function del(item) {
    setData(d => ({ ...d, projects: d.projects.filter(p => p.id !== item.id) }));
    setConfirm(null);
  }

  return (
    <>
      <CrudScreen title={t.projects} subtitle={t.projectsSubtitle}
        items={data.projects}
        columns={[
          {key:'name', label:t.name},
          {key:'clientId', label:t.client, muted:true, render: item => data.clients.find(c => c.id === item.clientId)?.name ?? '—'},
          {key:'estimatedAmount', label:t.estimatedAmount, render: item => <span style={{fontWeight:500}}>{fmtMoney(item.estimatedAmount)}</span>},
          {key:'finishDate', label:t.finishDate, muted:true, render: item => item.finishDate ? t.finish(item.finishDate) : '—'},
          {key:'description', label:t.description, muted:true},
        ]}
        onAdd={() => setModal({})}
        onEdit={item => setModal(item)}
        onDelete={item => setConfirm(item)}
      />
      {modal && <ProjectModal existing={modal.id ? modal : null} data={data} onSave={save} onClose={() => setModal(null)} />}
      {confirm && <ConfirmModal message={t.deleteConfirm(confirm.name)} onConfirm={() => del(confirm)} onCancel={() => setConfirm(null)} />}
    </>
  );
}

// ─── APP ───────────────────────────────────────────────────────────────────

function App() {
  const [user, setUser] = useState(null);
  const [screen, setScreen] = useState('monthly-projects');
  const [prevScreen, setPrevScreen] = useState(null);
  const [navCtx, setNavCtx] = useState({});
  const [data, setData] = useData();
  const [globalMonth, setGlobalMonth] = useState('2026-01');
  const [drawerOpen, setDrawerOpen] = useState(false);
  const [lang, setLang] = useState(() => localStorage.getItem('beetbite_lang') || 'en');

  const t = T[lang];
  const isRTL = lang === 'he';

  useEffect(() => {
    document.documentElement.setAttribute('dir', isRTL ? 'rtl' : 'ltr');
    document.documentElement.setAttribute('lang', lang);
    localStorage.setItem('beetbite_lang', lang);
  }, [lang, isRTL]);

  function navigate(s) {
    setPrevScreen(screen);
    setScreen(s);
  }

  const ctx = { lang, t, isRTL };

  if (!user) return (
    <LangContext.Provider value={ctx}>
      <LoginScreen onLogin={setUser} />
    </LangContext.Provider>
  );

  const mainScreens = {
    'monthly-projects': <MonthlyProjectsScreen data={data} setData={setData} onNav={navigate} navCtx={navCtx} setNavCtx={setNavCtx} month={globalMonth} />,
    'project-detail': <ProjectDetailScreen data={data} setData={setData} navCtx={navCtx} onBack={()=>navigate(prevScreen??'monthly-projects')} onNav={navigate} setNavCtx={setNavCtx} />,
    'monthly-income': <MonthlyIncomeScreen data={data} onNav={navigate} setNavCtx={setNavCtx} month={globalMonth} />,
    'monthly-corporations': <MonthlyCorporationsScreen data={data} month={globalMonth} />,
    'monthly-subcontractors': <MonthlySubcontractorsScreen data={data} setData={setData} month={globalMonth} />,
    'projects': <ProjectsScreen data={data} setData={setData} />,
    'clients': <ClientsScreen data={data} setData={setData} />,
    'subcontractors-crud': <SubcontractorsScreen data={data} setData={setData} />,
    'corporations-crud': <CorporationsScreen data={data} setData={setData} />,
  };

  return (
    <LangContext.Provider value={ctx}>
      <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
        <Sidebar
          current={screen}
          onNav={s=>{setNavCtx({});navigate(s);}}
          user={user}
          open={drawerOpen}
          onClose={()=>setDrawerOpen(false)}
        />
        <div style={{width:'var(--sidebar-w)',flexShrink:0}} className="sidebar-spacer" />
        <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minWidth:0}}>
          <TopHeader
            screen={screen}
            globalMonth={globalMonth}
            setGlobalMonth={setGlobalMonth}
            onMenuOpen={()=>setDrawerOpen(true)}
            lang={lang}
            setLang={setLang}
          />
          <main className="main-content" style={{flex:1,overflow:'auto',padding:'32px 36px',background:'var(--bg)'}}>
            {mainScreens[screen] ?? <div>Screen not found</div>}
          </main>
        </div>
      </div>
    </LangContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
