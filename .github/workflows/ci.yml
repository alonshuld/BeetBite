name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Callable so CD can gate publishing on a green CI instead of duplicating it.
  workflow_call:

# Inside a `workflow_call` the `github` context belongs to the caller, so
# `github.workflow` here is the *calling* workflow's name, not "CI". Without the
# literal prefix the run CD calls lands in "CD-<ref>" — the group CD itself
# already holds — and GitHub fails the whole run before any job starts. The
# prefix keeps each caller's run in its own group; keeping `github.workflow`
# keeps the called run separate from the standalone CI run on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # No job in this workflow drives a real browser — the unit specs mock
  # puppeteer, and the suite that does render PDFs runs in e2e.yml against
  # Playwright's Chromium. Puppeteer's own download lands in ~/.cache/puppeteer,
  # which setup-node's pnpm-store cache does not cover, so it would otherwise be
  # re-fetched every job.
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  lint:
    name: Format, lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `vp check` formats (Oxfmt), lints (Oxlint) and type-checks (tsgolint)
      # every app in one pass, from the root vite.config.ts. The pre-commit
      # hook runs the same command on the staged files.
      - name: Format, lint & typecheck
        run: pnpm check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run the unit suites explicitly: the root `test` script fans out to every
      # workspace, and apps/e2e's `test` is the Playwright suite (see e2e.yml).
      - name: Backend unit tests (Vitest)
        run: pnpm --filter backend test

      - name: Frontend unit tests (Vitest)
        run: pnpm --filter frontend test

  # Replays every migration into an empty Postgres and fails if the result is
  # not exactly schema.prisma — catches a schema edit committed without its
  # migration, which would otherwise only show up as drift in someone's dev DB.
  migrations:
    name: Migrations match schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same script `pnpm dev` runs: deploy, generate, then diff the DB
      # against schema.prisma with a non-zero exit on any difference.
      - name: Apply migrations and check for drift
        run: pnpm --filter backend db:sync

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all apps
        run: pnpm build
